---
name: Resize organization logos

on:
  push:
    paths:
      - 'bron/*.png'
      - 'scripts/resize.sh'
      - '.github/workflows/resize.yml'

permissions:
  contents: write

env:
  RESIZE_SIZES: '64 128 200'

concurrency:
  group: resize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resize:
    # need at least 26.04 for imagemagick 7
    runs-on: "ubuntu-26.04"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Generate resized logos
        run: |
          for size in $RESIZE_SIZES; do
            ./scripts/resize.sh "$size"
          done

      - name: Commit generated logos on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for size in $RESIZE_SIZES; do
            git add --all "${size}x${size}/"
          done

          if git diff --cached --quiet; then
            echo 'No generated logo changes to commit.'
            exit 0
          fi

          git commit -m 'Update resized organization logos'
          git push
