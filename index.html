<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A directory of SURFconext member organizations and their logos">
  <title>Organization logos</title>
  <style>
    :root {
      color-scheme: light;
      --page-background: #f4f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted-text: #5c667a;
      --border: #dce3ee;
      --accent: #185abc;
      --error-background: #fff1f0;
      --error-border: #e0aaa6;
      --error-text: #8c1d18;
      --placeholder: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page-background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .page {
      width: min(1400px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .intro {
      max-width: 42rem;
      margin: 0.75rem 0 0;
      color: var(--muted-text);
      font-size: 1.05rem;
    }

    .status {
      min-height: 1.75rem;
      margin: 0 0 1.25rem;
      color: var(--muted-text);
    }

    .status.error {
      padding: 1rem 1.25rem;
      border: 1px solid var(--error-border);
      border-radius: 0.75rem;
      background: var(--error-background);
      color: var(--error-text);
    }

    .status.error strong {
      display: block;
      margin-bottom: 0.25rem;
    }

    button {
      margin-top: 0.75rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 0.45rem;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    button:hover {
      background: #124a9b;
    }

    button:focus-visible {
      outline: 3px solid #8bb8f5;
      outline-offset: 2px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .organization {
      display: flex;
      min-height: 230px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: var(--surface);
      box-shadow: 0 2px 8px rgb(23 32 51 / 5%);
    }

    .logo-frame {
      display: grid;
      min-height: 160px;
      place-items: center;
      padding: 1rem;
      background: #ffffff;
    }

    .logo-image {
      display: block;
      width: 128px;
      height: 128px;
      object-fit: contain;
    }

    .logo-placeholder {
      display: grid;
      width: 128px;
      height: 128px;
      place-items: center;
      border: 1px dashed var(--border);
      border-radius: 0.5rem;
      background: var(--placeholder);
      color: var(--muted-text);
      font-size: 0.85rem;
      text-align: center;
    }

    .logo-placeholder[hidden],
    .logo-image[hidden] {
      display: none;
    }

    .organization-name {
      display: block;
      flex: 1;
      padding: 0.8rem 1rem 1rem;
      border-top: 1px solid var(--border);
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 2rem;
      border: 1px dashed var(--border);
      border-radius: 0.75rem;
      background: var(--surface);
      color: var(--muted-text);
      text-align: center;
    }

    .skeleton {
      height: 230px;
      border-radius: 0.8rem;
      background: linear-gradient(100deg, #e7edf5 30%, #f6f8fb 50%, #e7edf5 70%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton {
        animation: none;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 1rem, 1400px);
        padding-top: 2rem;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .organization {
        min-height: 205px;
      }

      .logo-frame {
        min-height: 135px;
        padding: 0.5rem;
      }

      .logo-image,
      .logo-placeholder {
        width: 96px;
        height: 96px;
      }

      .organization-name {
        padding: 0.65rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Organization logos</h1>
      <p class="intro">Browse the organizations connected to SURFconext.</p>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">Loading organizations&hellip;</div>
    <ul id="gallery" class="gallery" aria-label="Organization logos">
      <li class="skeleton" aria-hidden="true"></li>
      <li class="skeleton" aria-hidden="true"></li>
      <li class="skeleton" aria-hidden="true"></li>
      <li class="skeleton" aria-hidden="true"></li>
    </ul>
  </main>

  <script>
    "use strict";

    const CSV_URL = "orgs.csv";
    const LOGO_DIRECTORY = "128x128/";
    const statusElement = document.getElementById("status");
    const galleryElement = document.getElementById("gallery");

    /**
     * Parse CSV text while respecting quoted fields, escaped quotes, and newlines in quoted fields.
     * @param {string} text
     * @returns {string[][]}
     */
    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let insideQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];

        if (character === '"') {
          if (insideQuotes && text[index + 1] === '"') {
            field += '"';
            index += 1;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (character === "," && !insideQuotes) {
          row.push(field);
          field = "";
        } else if ((character === "\n" || character === "\r") && !insideQuotes) {
          if (character === "\r" && text[index + 1] === "\n") {
            index += 1;
          }
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      if (field !== "" || row.length > 0) {
        row.push(field);
        rows.push(row);
      }

      return rows;
    }

    /**
     * Convert CSV records to the fields needed by the gallery.
     * The source file contains comment-prefixed metadata/header lines.
     * @param {string} text
     * @returns {{guid: string, code: string, name: string}[]}
     */
    function organizationsFromCsv(text) {
      return parseCsv(text.replace(/^\uFEFF/, ""))
        .filter((row) => row.length >= 3 && row.some((field) => field.trim() !== ""))
        .filter((row) => !row[0].trim().startsWith("#"))
        .filter((row) => row[0].trim().toLowerCase() !== "crm_guid")
        .map((row) => ({
          guid: row[0].trim(),
          code: row[1].trim(),
          name: row[2].trim()
        }))
        .filter((organization) => organization.guid && organization.name);
    }

    function setStatus(message, type) {
      statusElement.className = type ? `status ${type}` : "status";
      statusElement.setAttribute("role", type === "error" ? "alert" : "status");
      statusElement.replaceChildren();

      if (type === "error") {
        const heading = document.createElement("strong");
        heading.textContent = message.heading;
        statusElement.append(heading, document.createTextNode(message.detail));
        const retryButton = document.createElement("button");
        retryButton.type = "button";
        retryButton.textContent = "Try again";
        retryButton.addEventListener("click", loadOrganizations);
        statusElement.appendChild(retryButton);
        return;
      }

      statusElement.textContent = message;
    }

    function createOrganizationCard(organization) {
      const item = document.createElement("li");
      item.className = "organization";

      const frame = document.createElement("div");
      frame.className = "logo-frame";

      const placeholder = document.createElement("span");
      placeholder.className = "logo-placeholder";
      placeholder.textContent = "Logo unavailable";
      placeholder.setAttribute("aria-hidden", "true");

      const image = document.createElement("img");
      image.className = "logo-image";
      image.width = 128;
      image.height = 128;
      image.alt = `${organization.name} logo`;
      image.loading = "lazy";
      image.hidden = true;
      image.addEventListener("load", () => {
        image.hidden = false;
        placeholder.hidden = true;
      });
      image.addEventListener("error", () => {
        image.hidden = true;
        placeholder.hidden = false;
        item.classList.add("missing-logo");
      });
      image.src = `${LOGO_DIRECTORY}${encodeURIComponent(organization.guid)}.png`;

      frame.append(placeholder, image);

      const name = document.createElement("span");
      name.className = "organization-name";
      name.textContent = organization.name;
      if (organization.code) {
        name.title = organization.code;
      }

      item.append(frame, name);
      return item;
    }

    function renderOrganizations(organizations) {
      galleryElement.replaceChildren();

      if (organizations.length === 0) {
        const emptyState = document.createElement("li");
        emptyState.className = "empty-state";
        emptyState.textContent = "No organizations were found.";
        galleryElement.appendChild(emptyState);
        return;
      }

      const cards = organizations.map(createOrganizationCard);
      galleryElement.append(...cards);
    }

    async function loadOrganizations() {
      setStatus("Loading organizations\u2026");
      galleryElement.replaceChildren(
        ...Array.from({ length: 4 }, () => {
          const skeleton = document.createElement("li");
          skeleton.className = "skeleton";
          skeleton.setAttribute("aria-hidden", "true");
          return skeleton;
        })
      );

      try {
        const response = await fetch(CSV_URL, { credentials: "same-origin" });
        if (!response.ok) {
          const error = new Error(`Unable to load organizations (HTTP ${response.status}).`);
          error.status = response.status;
          throw error;
        }

        const organizations = organizationsFromCsv(await response.text());
        renderOrganizations(organizations);
        setStatus(`${organizations.length} organization${organizations.length === 1 ? "" : "s"}`);
      } catch (error) {
        galleryElement.replaceChildren();
        if (error.status === 401 || error.status === 403) {
          setStatus({
            heading: "Access to the organization list was denied.",
            detail: "Please sign in to GitHub with an account that can access this repository, then try again."
          }, "error");
        } else {
          setStatus({
            heading: "The organization list could not be loaded.",
            detail: "Please check your connection or try again in a moment."
          }, "error");
        }
        console.error("Could not load orgs.csv", error);
      }
    }

    loadOrganizations();
  </script>
</body>
</html>
